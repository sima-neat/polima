name: PR Sanitization

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-sanitization:
    uses: sima-neat/.github/.github/workflows/pr-sanitization.yml@473e2cc61c2b3720ef5c7488d70f3cf643887da6
    with:
      allowed_base_patterns: develop,main,release-*
