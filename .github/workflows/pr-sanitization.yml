name: PR Sanitization

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-sanitization:
    uses: sima-neat/.github/.github/workflows/pr-sanitization.yml@a1bdd92b98bc59ff68f5ad824f6881def3ab132b
    with:
      allowed_base_patterns: develop,main,release-*
