name: Source CI

on:
  pull_request:
    branches: [develop, main, "release-*"]
  push:
    branches: [develop, main, "release-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polima-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # The full host stack, as `make venv` builds it (docs/install.md: Python 3.12).
    name: Full host stack (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # The native tests compile the runtime against tests/native/llima_mock.
        # The host stack is pinned exactly as `make venv` pins it for users.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ nlohmann-json3-dev
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -c constraints-host.txt -e ".[dev,host,robot]" torchvision
      - name: Lint
        run: ruff check src tests scripts/ci
      - name: Unit, native and contract tests
        run: pytest -q -ra tests/unit --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Allow only the listed skips
        run: python scripts/ci/check_skips.py "$RUNNER_TEMP/junit.xml" tests/allowed_skips.txt

  deploy-install:
    # The deploy and Workbench installation (docs/install.md: Python 3.10 to 3.12).
    name: Deploy install (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install and check as docs/install.md describes
        run: |
          python -m pip install -e ".[deploy]"
          polima --version
          polima doctor --deploy-only
          polima deploy --help > /dev/null
          polima run --help > /dev/null

  ui:
    name: Studio and Workbench UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/polima/studio/ui/package-lock.json
      - name: Test and build Studio
        working-directory: src/polima/studio/ui
        run: |
          npm ci
          node --test src/*.test.js
          npm run build
      - name: Require the committed Studio bundle to match its source
        run: git diff --exit-code -- src/polima/studio/static

  repository-contracts:
    name: Documentation and workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check documentation links and shell syntax
        run: |
          python3 scripts/ci/check_docs.py
          bash -n scripts/install_polima_modalix.sh scripts/ci/*.sh
          git diff --check
      - name: Validate workflow syntax
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$work/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $work/actionlint.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$work/actionlint.tar.gz" -C "$work" actionlint
          "$work/actionlint" -shellcheck= -pyflakes=
