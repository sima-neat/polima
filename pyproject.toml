[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polima"
version = "0.3.0"
description = "PoLiMa - unified compile/deploy/control framework for robot policies on SiMa.ai Modalix"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

# Keep the core usable in compiler and DevKit environments.
dependencies = ["numpy"]

[project.optional-dependencies]
# Host-side stages.
export  = [
    "torch", "safetensors", "pyarrow", "draccus", "pyyaml",
    "datasets", "pandas", "av", "jsonlines",
]
compile = ["onnx", "onnxsim", "onnxruntime", "pyyaml"]
deploy  = ["pyyaml"]
data    = ["pyarrow"]
host    = ["polima[data,export,compile,deploy]"]
# DevKit runtime dependencies; model export runs on the compiler host.
robot   = ["flask", "waitress", "opencv-python-headless", "pillow", "tokenizers==0.22.2"]
board   = ["polima[robot]"]
dev     = ["pytest", "ruff"]

[project.scripts]
polima = "polima.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polima = ["robot/assets/so101/*", "studio/static/*.html", "studio/static/assets/*", "workbench/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["hardware: requires a Modalix DevKit or an SO-101 arm (opt-in)"]
# So `pytest` works from a bare interpreter without `pip install -e .` first.
# The unit tests are stdlib+numpy only by design, which means there is no
# reason to require an install to run them -- and the three environments this
# repo targets cannot all install the same package.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
